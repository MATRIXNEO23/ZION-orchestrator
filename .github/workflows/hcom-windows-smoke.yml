name: ZION hcom Windows isolated smoke
on:
  push:
    branches: [test/windows-hcom-isolated-20261116]
  pull_request:
    paths:
      - '.github/workflows/hcom-windows-smoke.yml'
      - 'zion.py'
      - 'zion_gui.py'
      - 'tests/**'
jobs:
  hcom-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and ZION unit tests
        shell: pwsh
        run: |
          python -m py_compile zion.py zion_gui.py
          python -m unittest discover -s tests -v
      - name: Install hcom on isolated runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv
          uv tool install hcom
          $uvBin = (& uv tool dir --bin).Trim()
          if (-not (Test-Path (Join-Path $uvBin 'hcom.exe'))) {
            throw "hcom.exe not installed by uv"
          }
          $uvBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $uvBin 'hcom.exe') --version
      - name: Real hcom binary CLI smoke (no agent accounts or model calls)
        shell: pwsh
        run: |
          hcom --help
          hcom hooks status codex
          hcom hooks status claude
          hcom list
          Write-Host 'hcom CLI smoke complete: no authenticated agent communication was tested.'
