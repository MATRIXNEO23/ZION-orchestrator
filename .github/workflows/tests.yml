name: Zion Windows tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and GUI imports
        run: python -m py_compile zion.py zion_gui.py
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test without API calls
        run: python -c "import zion_gui; assert zion_gui.agent_name('{\"name\":\"codex-1\"}') == 'codex-1'; assert 'SQLite' in zion_gui.error_hint('database is locked')"
